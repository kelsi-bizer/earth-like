id: emma-baptiste
name: Dr. Emma Baptiste
role: protagonist
age: early 30s
occupation: Botanist; lead scientist, vegetation sample project; first landing team
tier: locked   # basics from Ch.1-2; traits proposed
traits: [brilliant, humble, uneasy with attention, nurturing, stubborn when she's sure]
